cat > pyproject.toml << 'EOF'
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "senmarket"
version = "0.1.0"
description = "SenMarket - Programme Data Engineering"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["senmarket"]
EOF